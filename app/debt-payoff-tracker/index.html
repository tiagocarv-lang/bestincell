<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Debt Payoff Tracker</title>
<meta name="theme-color" content="#F4F6F2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F2EA;--card:#FFFDF9;--ink:#2E2A26;--mute:#8C8378;--line:#ECE3D6;--soft:#F2EBE0;
--acc:#7D8F75;--acc-l:#E4EADF;--acc-d:#5E6F57;--blush:#D9A79A;--blush-l:#F6E6E0;--gold:#B89A6A;--red:#C46A5A;
--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,-apple-system,Segoe UI,Roboto,sans-serif;--r:18px}
[data-acc=blush]{--acc:#C98F80;--acc-l:#F6E6E0;--acc-d:#A86D5F}
[data-acc=blue]{--acc:#7E95A8;--acc-l:#E3EAF0;--acc-d:#5C7488}
[data-acc=terra]{--acc:#C07A58;--acc-l:#F5E4DA;--acc-d:#9C5C3E}
[data-acc=champ]{--acc:#B89A6A;--acc-l:#F3EBDD;--acc-d:#94784C}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:26px 18px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.mono{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 15px var(--serif);color:var(--gold);letter-spacing:.5px}
.brand b{font:600 22px/1 var(--serif);display:block}
.brand small{color:var(--mute);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;color:#5b544c;font-weight:500;text-align:left}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--acc-l);color:var(--acc-d);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--soft);border-radius:20px;padding:1px 8px;color:var(--mute)}
.nav button.on .cnt{background:#fff}
.sidecd{margin-top:auto;border-radius:16px;background:linear-gradient(160deg,var(--acc-l),var(--blush-l));padding:16px;position:relative;overflow:hidden}
.sidecd .n{font:600 40px/1 var(--serif);color:var(--acc-d)}
.sidecd small{color:#6f675e;font-size:12px}
.sidecd svg{position:absolute;right:-14px;top:-10px;width:96px;opacity:.55}
/* main */
main{flex:1;min-width:0;padding:30px 38px 60px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.top h1{font:600 40px/1 var(--serif);margin:0}
.top p{margin:6px 0 0;color:var(--mute)}
.top .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:7px 14px;font-size:12.5px;color:#5b544c}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--acc-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font:600 21px var(--serif);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3 .x{margin-left:auto;font:500 12px var(--sans);color:var(--mute)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:14px;background:var(--acc-l);display:grid;place-items:center;color:var(--acc-d);flex:none}
.kpi .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
.kpi .v{font:600 28px/1 var(--serif)}
.kpi small{color:var(--mute);font-size:12px;display:block;margin-top:3px}
.kpi .bar{margin-top:7px}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.bl i{background:var(--blush)}.bar.gd i{background:var(--gold)}.bar.rd i{background:var(--red)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;min-height:230px;padding:34px 38px;background:radial-gradient(120% 140% at 85% 20%,var(--blush-l) 0,transparent 55%),linear-gradient(120deg,#FBF7F0,var(--acc-l));border:1px solid var(--line);display:flex;align-items:center}
.hero .t small{letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--mute)}
.hero h2{font:600 54px/1 var(--serif);margin:8px 0 6px}
.hero p{margin:0;color:#6f675e}
.hero .cd{display:flex;gap:10px;margin-top:20px}
.hero .cd div{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;min-width:72px}
.hero .cd b{font:600 30px/1 var(--serif);display:block}
.hero .cd span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.hero .art{position:absolute;right:0;top:0;bottom:0;width:48%;pointer-events:none}
/* tables/forms */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl tr:hover td{background:#FCF9F4}
.in{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.tbl select.in,.vcard select.in{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:6px;text-overflow:clip}
.tbl select.pill{text-align:center;padding:4px 10px;width:auto;min-width:92px}
.tbl td:first-child{min-width:150px}
.tbl select.in,.vcard select.in{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:6px;text-overflow:clip}
.tbl select.pill{text-align:center;padding:4px 10px;width:auto;min-width:92px}
.tbl td:first-child{min-width:150px}
.in:hover{border-color:var(--line)}.in:focus{outline:0;border-color:var(--acc);background:#fff}
.fi{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;width:100%}
.fi:focus{outline:0;border-color:var(--acc)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600}
.p-yes{background:var(--acc-l);color:var(--acc-d)}.p-pend{background:#F5EEDD;color:#9A7B3E}.p-no{background:#F6E1DC;color:#A5574A}
.del{border:0;background:none;color:#c9bfb3;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:8px}
.del:hover{color:var(--red);background:#F6E1DC}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.addrow .fi{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:#5b544c}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:30px}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.list .it:last-child{border:0}
.list .it small{color:var(--mute);display:block;font-size:12px}
.list .it .r{margin-left:auto;text-align:right}
.ck{appearance:none;width:20px;height:20px;border-radius:7px;border:1.5px solid #cfc4b6;cursor:pointer;flex:none;display:grid;place-items:center;background:#fff}
.ck:checked{background:var(--acc);border-color:var(--acc)}
.ck:checked:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done{text-decoration:line-through;color:var(--mute)}
.photo{border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--blush-l),var(--acc-l));min-height:150px}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:600}
/* vendors */
.vcard{display:flex;flex-direction:column;gap:10px}
.vcard .h{display:flex;gap:12px;align-items:center}
.vcard .ic{width:42px;height:42px;border-radius:12px;background:var(--blush-l);display:grid;place-items:center;color:#A86D5F;flex:none}
.vcard .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.vcard .row{display:flex;justify-content:space-between;font-size:12.5px;color:#5b544c}
/* seating */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.rt{text-align:center}
.rt .tname{font:600 19px var(--serif)}
.rt ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:#5b544c;min-height:20px}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0 14px;display:flex;gap:14px;align-items:flex-start}
.tl .ev:before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl .tm{font:600 20px/1.2 var(--serif);width:70px;flex:none}
.sw{display:flex;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
label.f{display:block;font-size:12px;color:var(--mute);margin:0 0 5px;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;transition:.25s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
.tabbar{display:none}
[data-theme=dark]{--bg:#1C1A18;--card:#262320;--ink:#F1EBE2;--mute:#A79D90;--line:#3A3530;--soft:#2F2B27;--acc-l:#33402F;--blush-l:#3E2E2A}
[data-theme=dark] .hero{background:radial-gradient(120% 140% at 85% 20%,#3E2E2A 0,transparent 55%),linear-gradient(120deg,#2A2622,#2C3529)}
[data-theme=dark] .hero .art,[data-theme=dark] .photo svg,[data-theme=dark] .sidecd svg{opacity:.55}
[data-theme=dark] .hero .cd div{background:rgba(255,255,255,.06)}
[data-theme=dark] .fi,[data-theme=dark] .in:focus,[data-theme=dark] .ck{background:#1F1D1A}
[data-theme=dark] .tbl tr:hover td{background:#2B2824}
[data-theme=dark] .photo{background:linear-gradient(135deg,#3E2E2A,#2C3529)}
[data-theme=dark] .tabs button.on{background:var(--acc);border-color:var(--acc)}
[data-theme=dark] .pill.p-pend{background:#3B3324;color:#D9B977}[data-theme=dark] .pill.p-no{background:#3E2A26;color:#E09A8C}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{min-height:140px;resize:vertical;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;line-height:1.5}
.note textarea:focus{outline:0;border-color:var(--acc);background:var(--card)}
@media print{.side,.tabbar,.btn,.del,.addrow,.tabs,.toast,.photo,.hero .art{display:none!important}body,main{background:#fff;padding:0}.card{border:0;break-inside:avoid}select,input{border:0!important;appearance:none;-webkit-appearance:none}.app{display:block}}@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
 .side{display:none}
 main{padding:18px 16px 96px}
 .top{flex-wrap:wrap}.top h1{font-size:32px}.top .r{margin-left:0}
 .g2,.g21,.g12,.g3{grid-template-columns:1fr}
 .hero{padding:24px;min-height:200px}.hero h2{font-size:40px}.hero .art{opacity:.45;width:70%}
 .hide-m{display:none}
 .grid>*{min-width:0}
 .kpi{gap:10px}.kpi .ic{width:36px;height:36px;border-radius:11px}.kpi .v{font-size:23px}.card{padding:16px}
 .addrow .fi{min-width:0;flex:1 1 40%}
 .hero .cd div{min-width:60px;padding:8px 10px}
 .tblw{overflow-x:auto}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;overflow-x:auto}
 .tabbar button{flex:1 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 2px}
 .tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
 .tabbar button.on{color:var(--acc-d);font-weight:600}
}
.th{border-radius:12px;object-fit:cover;flex:none;cursor:pointer;display:block}
.th.add{border:1.5px dashed var(--line);background:var(--soft);color:var(--mute);display:grid;place-items:center;padding:0;cursor:pointer}
.th.add svg,.tap svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.heroimg{position:absolute;right:22px;top:50%;transform:translateY(-50%) rotate(3deg);width:38%;max-width:300px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:8px solid #fff;box-shadow:0 18px 40px rgba(40,30,20,.22)}
.cover{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;margin-bottom:10px}
.memc .cover{aspect-ratio:4/3;margin:0}.memc{padding:8px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.88);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap;color:#3a332c}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:860px){.album{grid-template-columns:1fr 1fr;gap:10px}.heroimg{position:relative;right:auto;top:auto;transform:rotate(2deg);width:100%;max-width:none;margin-top:16px}.hero:has(.heroimg){flex-direction:column;align-items:stretch}}
@media (max-width:420px){.album{grid-template-columns:1fr}}

/* ===== PREMIUM SKIN v2 (FinnestStudio-level polish) ===== */

/* ===== CALM LAYER ===== */
.calmtools{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 12px}.calmtools .chip{cursor:pointer}
.calmnext{background:linear-gradient(135deg,#2A211B,#3A2C22)!important;color:#fff;border:0!important;padding:26px 28px!important}
.calmnext .cn-top{display:flex;align-items:center;gap:10px}.cn-pill{white-space:nowrap;background:var(--acc);color:#fff;border-radius:999px;padding:5px 12px;font:700 12px var(--sans);letter-spacing:.04em}
.cn-src{font-size:12.5px;color:rgba(255,255,255,.6)}.cn-help{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;font-weight:700}
.cn-t{font:800 36px/1.1 var(--serif);letter-spacing:-.02em;margin:14px 0 6px}.cn-s{color:rgba(255,255,255,.7);margin:6px 0 0;font-size:14px}
.cn-b{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.calmnext .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.onb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--acc) 12%,#fff);border:1px solid color-mix(in srgb,var(--acc) 30%,#fff);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px}.onb-b{margin-left:auto;display:flex;gap:8px}
.fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#fff;font:600 34px/1 var(--sans);cursor:pointer;z-index:40;box-shadow:0 12px 28px color-mix(in srgb,var(--acc) 45%,transparent)}
#calmmodal{display:none;position:fixed;inset:0;z-index:60}.cm-bg{position:absolute;inset:0;background:rgba(30,22,16,.45);backdrop-filter:blur(3px)}
.cm{position:relative;max-width:460px;margin:12vh auto 0;background:#fff;color:#2A211B;border-radius:26px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.cm-x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:26px;color:#9A8D80;cursor:pointer}
.cm-k{letter-spacing:.18em;font:700 11.5px var(--sans);color:var(--acc)}.cm-h{font:800 26px/1.2 var(--serif);margin:8px 0 18px}.cm .cn-s{color:#7A6E63}
.ring{width:200px;height:200px;border-radius:50%;margin:10px auto 6px;display:grid;place-items:center}.ring .tm{width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 40px var(--serif)}
.stuck{display:flex;flex-direction:column;gap:8px}.stuck button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid #EADFD2;background:#FBF7F1;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600}.stuck span{font-size:22px}
.help{margin:0;padding-left:18px;line-height:1.6;color:#4A3F36}
@media (max-width:860px){.fab{bottom:84px;right:18px}.cn-src{display:none}.calmnext{padding:22px 20px!important}.cn-t{font-size:28px}.calmtools{justify-content:flex-start}}
@media print{.fab,.calmtools,.calmnext,.onb{display:none!important}}
html[data-theme=dark] .cm{background:#262320;color:#F1EBE2}
html[data-theme=dark] .onb{background:#2E2925;border-color:#4A3F37;color:#F1EBE2}

.tblw{overflow-x:auto;max-width:100%}.card{min-width:0}

:root{--bg:#F4F6F2;--acc:#3F7D5A;--acc-l:#DDEDE3;--acc-d:#2B5C40;--blush:#3F7D5A;--blush-l:#DDEDE3;--gold:#C9A24D}
.hero{background:radial-gradient(120% 140% at 85% 20%,#DDEDE3 0,transparent 55%),linear-gradient(120deg,#FDFBF8,#DDEDE3)}
[data-acc=sage]{--acc:#6E8B74;--acc-l:#E1EBE3;--acc-d:#4F6955}[data-acc=rose]{--acc:#B5546B;--acc-l:#F5DEE3;--acc-d:#8E3B50}[data-acc=navy]{--acc:#34507A;--acc-l:#DEE5F0;--acc-d:#243A5A}[data-acc=gold]{--acc:#B8914E;--acc-l:#F3EAD8;--acc-d:#8E6E36}[data-acc=plum]{--acc:#7A4A6B;--acc-l:#EEDFE9;--acc-d:#5A3450}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.mini .d{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px;min-height:120px}.mini .d h4{margin:0 0 6px;font:600 18px var(--serif)}.mini .d .in{font-size:12.5px;padding:3px 4px}.mini .d small{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.chipc{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;background:var(--acc-l);color:var(--acc-d)}
@media (max-width:860px){.mini{grid-template-columns:1fr 1fr}}

// month-by-month payoff simulation (snowball = smallest balance first, avalanche = highest rate first)
function sim(method){let ds=S.debts.map(d=>({n:d.name,b:+d.bal||0,r:(+d.rate||0)/1200,m:+d.min||0})).filter(d=>d.b>0);let months=0,interest=0;const order=[];const budget=sum(ds,d=>d.m)+(+S.extra||0);
 while(ds.some(d=>d.b>0.01)&&months<600){months++;ds.forEach(d=>{if(d.b>0){const i=d.b*d.r;interest+=i;d.b+=i}});let left=budget;
  ds.filter(d=>d.b>0).forEach(d=>{const p=Math.min(d.m,d.b);d.b-=p;left-=p});
  const tgt=ds.filter(d=>d.b>0.01).sort((a,b)=>method==='avalanche'?b.r-a.r:a.b-b.b);for(const d of tgt){if(left<=0)break;const p=Math.min(left,d.b);d.b-=p;left-=p}
  ds.forEach(d=>{if(d.b<=0.01&&!order.find(o=>o.n===d.n))order.push({n:d.n,m:months})})}
 return {months,interest,order}}

/* BestInCell Sync: phone <-> computer, no account.
   Usage: BICSync.init({keys:['family-v1'], name:'Family Planner'})  then BICSync.open() from a button.
   Data is encrypted on the device (AES-GCM 256) before it leaves; the server only stores ciphertext.
   Pairing: device A shows a 6-digit code (10 min). Device B types it and receives the sync id + key,
   wrapped with a key derived from the code (PBKDF2). */
(function () {
  const API = 'https://bic-sync.bestincell.workers.dev';
  const LS = 'bic-sync';
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const ub64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const hex = (u8) => [...u8].map((b) => b.toString(16).padStart(2, '0')).join('');
  let CFG = { keys: [], name: 'this app' }, ST = null, applying = false, timer = null, busy = false;

  const loadSt = () => { try { ST = JSON.parse(localStorage.getItem(LS + ':' + CFG.keys[0])) } catch (e) { ST = null } };
  const saveSt = () => localStorage.setItem(LS + ':' + CFG.keys[0], JSON.stringify(ST));

  async function aes(rawKey) { return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['encrypt', 'decrypt']) }
  async function seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64(out);
  }
  async function open_(key, s) { const u = ub64(s); return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)))) }
  async function codeKey(code) {
    const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('bestincell-pair-' + code), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  const req = async (method, path, body) => {
    const r = await fetch(API + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.error || r.status); e.status = r.status; e.body = j; throw e } return j;
  };

  const snapshot = () => { const o = {}; CFG.keys.forEach((k) => { const v = localStorage.getItem(k); if (v != null) o[k] = v }); return o };

  async function push() {
    if (!ST || busy) return; busy = true;
    try {
      const key = await aes(ub64(ST.k)); const t = Date.now();
      await req('PUT', '/s/' + ST.sid, { t, data: await seal(key, snapshot()) });
      ST.t = t; ST.last = t; saveSt(); status('Synced ✓');
    } catch (e) { if (e.status === 409) await pull(true); else status('Offline: will sync later') }
    finally { busy = false }
  }
  async function pull(force) {
    if (!ST) return false;
    try {
      const r = await req('GET', '/s/' + ST.sid);
      if (!r.data || (!force && r.t <= (ST.t || 0))) return false;
      const snap = await open_(await aes(ub64(ST.k)), r.data);
      applying = true; Object.entries(snap).forEach(([k, v]) => localStorage.setItem(k, v)); applying = false;
      ST.t = r.t; ST.last = Date.now(); saveSt(); location.reload(); return true;
    } catch (e) { status('Offline: will sync later'); return false }
  }
  const schedule = () => { if (!ST || applying) return; clearTimeout(timer); timer = setTimeout(push, 2500) };

  // Watch writes to the app's keys.
  const set0 = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) { set0.call(this, k, v); if (this === localStorage && CFG.keys.includes(k)) schedule() };

  // ---------- UI ----------
  let box;
  function status(t) { const s = box && box.querySelector('#bic-st'); if (s) s.textContent = t }
  function css() {
    if (document.getElementById('bic-css')) return;
    const s = document.createElement('style'); s.id = 'bic-css';
    s.textContent = `#bic-sync{position:fixed;inset:0;z-index:9999;background:rgba(20,16,28,.45);display:grid;place-items:center;font:15px/1.45 Inter,system-ui,sans-serif}
#bic-sync .p{background:#fff;color:#1d1a22;border-radius:22px;max-width:400px;width:calc(100% - 32px);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
#bic-sync h3{margin:0 0 6px;font-size:20px}#bic-sync p{margin:0 0 14px;color:#6b6475}
#bic-sync .b{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:600 15px inherit;margin-top:8px;cursor:pointer;background:#1d1a22;color:#fff}
#bic-sync .b.g{background:#f1edf5;color:#1d1a22}#bic-sync .code{font:800 40px/1 ui-monospace,monospace;letter-spacing:8px;text-align:center;padding:16px;background:#f6f3f9;border-radius:14px;margin:6px 0 10px}
#bic-sync input{width:100%;box-sizing:border-box;font:800 30px ui-monospace,monospace;letter-spacing:8px;text-align:center;padding:12px;border:2px solid #e4dfea;border-radius:14px}
#bic-sync small{display:block;color:#8a8494;margin-top:12px;font-size:12.5px}#bic-st{color:#3c8a5e;font-weight:600;margin-top:10px;min-height:20px}`;
    document.head.appendChild(s);
  }
  function view(html) { box.querySelector('.p').innerHTML = html + '<div id="bic-st"></div><button class="b g" data-x="close">Close</button>' }
  function home() {
    if (ST) view(`<h3>⇅ Sync is on</h3><p>${CFG.name} stays the same on your linked devices. Changes sync within a few seconds.</p>
      <button class="b" data-x="add">Link another device</button><button class="b g" data-x="now">Sync now</button><button class="b g" data-x="off">Turn off sync on this device</button>
      <small>Encrypted on your device before it is sent. No account, no email.</small>`);
    else view(`<h3>⇅ Sync phone & computer</h3><p>Use ${CFG.name} on your phone and your computer, with the same data.</p>
      <button class="b" data-x="start">This is my first device</button><button class="b g" data-x="join">I have a code from my other device</button>
      <small>No account, no email, no password. Your data is encrypted on this device before it is sent.</small>`);
  }
  async function showCode() {
    view('<h3>Link a device</h3><p>Creating your code…</p>');
    const kb = await codeKeyBox();
    view(`<h3>Your code</h3><p>On your other device, open ${CFG.name} → Sync → “I have a code”, and type:</p><div class="code">${kb}</div><small>Valid for 10 minutes, works once.</small>`);
  }
  async function codeKeyBox() {
    for (let i = 0; i < 5; i++) {
      const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0');
      const box_ = await seal(await codeKey(code), { sid: ST.sid, k: ST.k });
      try { await req('POST', '/pair', { code, box: box_ }); return code } catch (e) { if (e.status !== 409) throw e }
    }
    throw new Error('busy');
  }
  async function act(x) {
    try {
      if (x === 'close') return box.remove();
      if (x === 'start') { if (CFG.beforeStart) CFG.beforeStart(); ST = { sid: hex(crypto.getRandomValues(new Uint8Array(16))), k: b64(crypto.getRandomValues(new Uint8Array(32))), t: 0 }; saveSt(); await push(); return showCode() }
      if (x === 'add') return showCode();
      if (x === 'now') { status('Syncing…'); if (!(await pull())) await push(); return }
      if (x === 'off') { localStorage.removeItem(LS + ':' + CFG.keys[0]); ST = null; return home() }
      if (x === 'join') return view(`<h3>Type the code</h3><p>Shown on your other device.</p><input id="bic-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="b" data-x="link">Link</button><small>This device will take the data of your other device.</small>`);
      if (x === 'link') {
        const code = (box.querySelector('#bic-code').value || '').replace(/\D/g, '');
        if (code.length !== 6) return status('Type the 6 digits');
        status('Linking…');
        const r = await req('GET', '/pair/' + code).catch(() => null);
        if (!r) return status('Code not found or expired');
        const v = await open_(await codeKey(code), r.box);
        ST = { sid: v.sid, k: v.k, t: 0 }; saveSt(); status('Linked! Loading your data…');
        if (!(await pull(true))) { await push(); home() }
      }
    } catch (e) { status('Something went wrong. Check your connection and try again.') }
  }
  window.BICSync = {
    init(cfg) {
      CFG = Object.assign(CFG, cfg); loadSt();
      if (ST) { pull(); addEventListener('focus', () => pull()); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); else if (timer) { clearTimeout(timer); push() } }) }
    },
    open() { css(); box && box.remove(); box = document.createElement('div'); box.id = 'bic-sync'; box.innerHTML = '<div class="p"></div>'; box.addEventListener('click', (e) => { const x = e.target.dataset.x; if (x) act(x); else if (e.target === box) box.remove() }); document.body.appendChild(box); home() },
    get on() { return !!ST },
  };
})();

function branch(x,y,len,ang,col,leaf){let s='',a=ang*Math.PI/180;const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;
 s+=`<path d="M${x} ${y} Q ${(x+ex)/2+Math.sin(a)*18} ${(y+ey)/2-Math.cos(a)*18} ${ex} ${ey}" stroke="${col}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
 for(let i=1;i<=leaf;i++){const t=i/(leaf+1),px=x+(ex-x)*t+Math.sin(a)*18*4*t*(1-t),py=y+(ey-y)*t-Math.cos(a)*18*4*t*(1-t),r=15-t*7;
  for(const sd of[-1,1]){const la=a+sd*1.05,cx=px+Math.cos(la)*r*1.05,cy=py+Math.sin(la)*r*1.05;
   s+=`<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${(r*.62).toFixed(1)}" ry="${r.toFixed(1)}" transform="rotate(${(la*180/Math.PI+90).toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${col}" opacity="${(.55+.35*((i+(sd>0))%2)).toFixed(2)}"/>`}}
 return s}

 for(let k=0;k<4;k++){const rr=r*(.85-k*.2);s+=`<path d="M${cx-rr} ${cy} a${rr} ${rr*.9} 0 0 1 ${rr*2} 0" stroke="${c2}" stroke-width="1.4" fill="none" transform="rotate(${k*55} ${cx} ${cy})" opacity=".8"/>`}
 return s}

 <div class="album">${S.mem.map(m=>`<div class="card memc">${cover('mem',m,m.ph||keys[0])}<div style="display:flex;align-items:center;gap:4px;padding:8px 6px 2px">${inp('mem',m,'cap',{ph:'Caption',st:'font:600 17px var(--serif);padding:2px 6px'})}${del('mem',m)}</div>${inp('mem',m,'date',{type:'date',st:'font-size:12px;color:var(--mute);padding:0 6px 6px'})}</div>`).join('')||'<div class="card empty">Add your first photo ♡</div>'}</div>
 <p style="color:var(--mute);font-size:12.5px;margin-top:14px">Photos are resized and saved on this device only. Use Settings → Export to back them up.</p>`}
function memDemo(rows){return rows.map(([c,k],i)=>({id:uid(),img:'',ph:k,cap:c,date:new Date(Date.now()-(i*23+5)*864e5).toISOString().slice(0,10)}))}
Object.assign(CORE_ACT,{photo:t=>pickPhoto(t.dataset.c,t.dataset.id),nohero:()=>{S.heroImg='';save();rerender()},
 addmem:()=>{const ks=APP.memArt||['x'];const m={id:uid(),img:'',ph:ks[S.mem.length%ks.length],cap:'',date:new Date().toISOString().slice(0,10)};S.mem.unshift(m);save();rerender();pickPhoto('mem',m.id)}});
// ---- generic page builders (shared by simple apps) ----
function cellFor(c,x,col){const [f,,k,o]=col;
 if(k==='chk')return chk(c,x,f);if(k==='sel')return sel(c,x,f,o);if(k==='num'||k==='money')return inp(c,x,f,{num:1});if(k==='date')return inp(c,x,f,{type:'date'});if(k==='time')return inp(c,x,f,{type:'time'});if(k==='thumb')return thumb(c,x,40);if(k==='stars')return sel(c,x,f,[['0','—'],['1','★'],['2','★★'],['3','★★★'],['4','★★★★'],['5','★★★★★']],{st:'width:auto;color:var(--gold)'});return inp(c,x,f,{ph:o||''})}
function tablePage(o){let rows=S[o.c];if(o.filter){const v=fv(o.c+'f','all');if(v!=='all')rows=rows.filter(x=>String(x[o.filter[0]])===v)}if(o.sort)rows=rows.slice().sort(o.sort);
 const w={chk:'40px',num:'90px',money:'100px',date:'150px',time:'110px',thumb:'56px',stars:'120px'};
 const tbl=`<div class="tblw"><table class="tbl"><tr>${o.cols.map(c=>`<th class="${['num','money'].includes(c[2])?'num':''}">${c[1]}</th>`).join('')}<th></th></tr>${rows.map(x=>`<tr>${o.cols.map(c=>`<td style="${w[c[2]]?'width:'+w[c[2]]:''}">${cellFor(o.c,x,c)}</td>`).join('')}<td>${del(o.c,x)}</td></tr>`).join('')}</table>${rows.length?'':`<div class="empty">${o.empty||'Nothing yet'}</div>`}</div>`;
 const ft=o.filter?tabs(o.c+'f',[['all','All']].concat(o.filter[1].map(v=>Array.isArray(v)?v:[v,v]))):'';
 return `${head(o.t,o.s||'',`${o.right||''}<button class="btn" data-act="addrow" data-c="${o.c}">${ic('plus',15)} ${o.addLabel||'Add'}</button>`)}${o.top||''}
 ${o.side?`<div class="grid g21"><div class="card">${ft}${tbl}</div><div class="grid" style="align-content:start">${o.side}</div></div>`:`<div class="card">${ft}${tbl}</div>`}`}
function gridTracker(o){const t=new Date(),y=t.getFullYear(),m=t.getMonth(),nd=new Date(y,m+1,0).getDate(),pre=`${y}-${String(m+1).padStart(2,'0')}-`;
 const streak=x=>{let s=0;for(let d=t.getDate();d>0;d--){if(x.log&&x.log[pre+String(d).padStart(2,'0')])s++;else if(d!==t.getDate())break}return s};
 return `<div class="card"><h3>${o.t}<span class="x">${t.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span></h3><div class="tblw"><table class="tbl" style="font-size:12px"><tr><th>${o.label||'Item'}</th>${[...Array(nd)].map((_,i)=>`<th style="text-align:center;padding:4px 0;font-size:10px;letter-spacing:0">${i+1}</th>`).join('')}<th class="num">🔥</th></tr>
 ${S[o.c].map(x=>`<tr><td style="min-width:110px;width:150px">${inp(o.c,x,o.f||'name',{st:'font-weight:600'})}</td>${[...Array(nd)].map((_,i)=>{const k=pre+String(i+1).padStart(2,'0'),on=x.log&&x.log[k];return `<td style="padding:1px;text-align:center"><button data-act="tick" data-c="${o.c}" data-id="${x.id}" data-k="${k}" style="width:100%;max-width:22px;min-width:12px;aspect-ratio:1;height:auto;border-radius:5px;border:1px solid var(--line);background:${on?(x.col||'var(--acc)'):'transparent'};cursor:pointer;padding:0;display:block;margin:0 auto"></button></td>`}).join('')}<td class="num"><b>${streak(x)}</b></td></tr>`).join('')}</table></div></div>`}
function logDemo(days,p){const t=new Date(),y=t.getFullYear(),m=t.getMonth(),o={};for(let d=1;d<=Math.min(days,t.getDate());d++)if(Math.random()<p)o[`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`]=1;return o}
Object.assign(CORE_ACT,{addrow:t=>{const c=t.dataset.c;S[c].unshift(Object.assign(JSON.parse(JSON.stringify(((APP.defaults||{})[c])||{})),{id:uid()}));save();rerender()},
 tick:t=>{const it=S[t.dataset.c].find(x=>x.id===t.dataset.id);it.log=it.log||{};if(it.log[t.dataset.k])delete it.log[t.dataset.k];else it.log[t.dataset.k]=1;save();rerender()}});
// ---- extra tabs added after launch (used by <app>/post.js) ----
// addTab(after, [key,label,icon], arrayKey, seed(), defaults, keepSeedOnFreshStart)
function addTab(after,tab,arr,seed,def,keep){const i=APP.pages.findIndex(p=>p[0]===after);APP.pages.splice(i<0?APP.pages.length-2:i+1,0,tab);if(!arr)return;
 if(!APP.arrays.includes(arr))APP.arrays.push(arr);const mk=()=>seed?seed().map(x=>Object.assign({id:uid()},x)):[];
 if(!Array.isArray(S[arr]))S[arr]=mk();APP.defaults=APP.defaults||{};APP.defaults[arr]=def||{};
 const _d=APP.demo;APP.demo=()=>{const s=_d();s[arr]=mk();return s};const _b=APP.blank;APP.blank=()=>{const s=_b();s[arr]=keep?mk():[];return s}}
const isoAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};

// ===== CALM LAYER: next small step, 5-min timer, stuck helper, brain dump, quick add, onboarding, focus mode, help =====
if(!Array.isArray(S.dump))S.dump=[];
if(APP.calmSeed&&!S.dump.length&&!S._cs){S.dump=APP.calmSeed.map(t=>({id:uid(),t}));S._cs=1}
const CALM_N={ms:'Milestones',books:'Books',pack:'Packing list',menu:'Menu',appts:'Appointments',tasks:'To-do',todo:'To-do',shop:'Shopping',chores:'Chores',daily:'Daily',bills:'Bills',gifts:'Gifts',routines:'Routines',plan:'Meal plan',grocery:'Grocery list',goals:'Goals',buy:'Baby shopping'};
const CALM_P=['tasks','todo','chores','daily','routines','appts','bills','pack'];
const CALM_F=['done','got','bought','paid','packed','wrapped','sent','claimed','booked','ok'];
const CALM_L=x=>x.task||x.name||x.item||x.title||x.what||x.dish||x.t||x.text||'';
function calmCands(){const out=[];S.dump.forEach(d=>out.push({c:'dump',id:d.id,f:null,label:d.t,src:'Brain dump'}));
 (APP.calmFrom||[...APP.arrays].sort((a,b)=>(CALM_P.includes(b)?1:0)-(CALM_P.includes(a)?1:0))).filter(k=>!['mem','notes','dump'].includes(k)).forEach(k=>{(S[k]||[]).forEach(x=>{const f=CALM_F.find(f=>f in x);if(f&&!x[f]&&CALM_L(x)){const pg=CALM_N[k]||(APP.pages.find(p=>p[0]===k)||[])[1]||k[0].toUpperCase()+k.slice(1);out.push({c:k,id:x.id,f,label:CALM_L(x),src:pg})}})});return out}
function calmCur(){const c=calmCands();return c.find(x=>x.id===S.nextId)||c[0]}
function calmCard(){const n=calmCur();return `<div class="card calmnext"><div class="cn-top"><span class="cn-pill">Your next small step</span><span class="cn-src">${n?'from '+esc(n.src):''}</span><button class="cn-help" data-act="calmhelp" title="How this works">?</button></div>
 <div class="cn-t">${n?esc(n.label):'All clear for now 🌿'}</div>${n?'':'<p class="cn-s">Nothing waiting. Add something to the brain dump below, or enjoy the calm.</p>'}
 <div class="cn-b">${n?`<button class="btn" data-act="calm5">▶ Just 5 minutes</button><button class="btn ghost" data-act="calmstuck">Stuck?</button><button class="btn ghost" data-act="calmpick">🎲 Pick for me</button><button class="btn ghost" data-act="calmdone">✓ Done</button>`:''}</div></div>`}
function dumpCard(){return `<div class="card"><h3>🧠 Brain dump<span class="x">get it out of your head</span></h3><div class="addrow"><input class="fi" id="dumpin" placeholder="What's on your mind? Type and press Enter" data-enter="dumpadd"><button class="btn" data-act="dumpadd">Add</button></div>
 <div class="list">${S.dump.map(d=>`<div class="it"><div style="flex:1">${esc(d.t)}</div><button class="btn ghost sm" data-act="dumpnext" data-id="${d.id}">Make it next</button><button class="del" data-delc="dump" data-id="${d.id}">×</button></div>`).join('')||'<div class="empty" style="padding:14px">Empty mind, happy mind ✨</div>'}</div></div>`}
const CALM_ONB=KEY+'-onb';
function onbBar(){if(/[?&]cap=/.test(location.search))return '';let seen=null;try{seen=localStorage.getItem(CALM_ONB)}catch(e){}if(seen)return '';
 return `<div class="onb"><div>👋 <b>This is an example planner.</b> Look around and tap anything, nothing here is yours yet.</div><div class="onb-b"><button class="btn ghost sm" data-act="onbkeep">Keep exploring</button><button class="btn sm" data-act="onbfresh">Start my own</button></div></div>`}
function calmTools(){return `<div class="calmtools" style="margin:0"><button class="chip" data-act="focus">${S.focus?'✕ Exit focus':'🎯 Focus mode'}</button><button class="chip" data-act="calmhelp">? Help</button></div>`}
const _view=view;
view=function(){if(!Array.isArray(S.dump))S.dump=[];if(page!=='dashboard')return _view();
 if(S.focus)return `${onbBar()}<div class="top"><div><h1>Focus</h1><p>One thing at a time. Everything else can wait.</p></div><div class="r">${calmTools()}</div></div>${calmCard()}<div style="margin-top:16px">${dumpCard()}</div>`;
 const h=_view();const i=h.indexOf('<div class="r">');let top='',rest=h;if(i>=0){const j=h.indexOf('</div></div>',i)+12;top=h.slice(0,j-12)+calmTools()+'</div></div>';rest=h.slice(j)}return onbBar()+top+calmCard()+'<div style="height:16px"></div>'+rest+'<div style="margin-top:16px">'+dumpCard()+'</div>'};
function modal(html){let m=$('#calmmodal');if(!m){m=document.createElement('div');m.id='calmmodal';document.body.appendChild(m)}m.innerHTML=`<div class="cm-bg" data-act="cmclose"></div><div class="cm">${html}<button class="cm-x" data-act="cmclose">×</button></div>`;m.style.display='block'}
let CALM_T=null;
function calmTimer(sec){const n=calmCur();let left=sec,run=true;clearInterval(CALM_T);
 const draw=()=>{const m=$('#calmmodal .cm');if(!m)return;const p=1-left/sec;m.querySelector('.ring').style.background=`conic-gradient(var(--acc) ${p*360}deg,var(--acc-l) 0)`;m.querySelector('.tm').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')};
 modal(`<small class="cm-k">FOCUSING ON</small><h2 class="cm-h">${esc(n?n.label:'Your step')}</h2><div class="ring"><div class="tm">5:00</div></div><div class="cn-b" style="justify-content:center"><button class="btn ghost" data-act="tpause">Pause</button><button class="btn ghost" data-act="tplus">+5 min</button><button class="btn" data-act="calmdone">✓ Done</button></div><p class="cn-s" style="text-align:center">Just start. Five minutes is enough.</p>`);
 draw();CALM_T=setInterval(()=>{if(!run)return;left--;draw();if(left<=0){clearInterval(CALM_T);toast('⏰ 5 minutes done! Keep going or call it a win.')}},1000);
 window._tp=()=>{run=!run;const b=document.querySelector('[data-act=tpause]');b&&(b.textContent=run?'Pause':'Resume')};window._tx=()=>{left+=300;sec+=300;draw()}}
const STUCK=[['🌫','Not sure where to start','Write the very first tiny action, like "open the app" or "find the receipt".'],['🏔','It feels too big','Shrink it: what would 2 minutes of it look like? Do only that.'],['😮‍💨','Dreading it','Do the worst 2 minutes first. Put on one song and stop when it ends.'],['⏳','Waiting on someone','Send a quick check-in message, then pick something else.'],['🔋','No energy today','Choose something lighter with Pick for me, or call it a gentle day.']];
Object.assign(CORE_ACT,{
 calm5(){calmTimer(300)},tpause(){window._tp&&window._tp()},tplus(){window._tx&&window._tx()},
 cmclose(){clearInterval(CALM_T);const m=$('#calmmodal');m&&(m.style.display='none')},
 calmdone(){const n=calmCur();if(!n)return;if(n.c==='dump')S.dump=S.dump.filter(x=>x.id!==n.id);else{const it=(S[n.c]||[]).find(x=>x.id===n.id);it&&(it[n.f]=true)}S.nextId=null;save();CORE_ACT.cmclose();rerender();toast('✓ Done. That counts!')},
 calmpick(){const c=calmCands();if(c.length<2)return;let p;do{p=c[Math.floor(Math.random()*c.length)]}while(p.id===(calmCur()||{}).id);S.nextId=p.id;save();rerender();toast('🎲 Picked for you: '+p.label)},
 calmstuck(){modal(`<small class="cm-k">STUCK? SAY WHY</small><h2 class="cm-h">What's in the way?</h2><div class="stuck">${STUCK.map((s,i)=>`<button data-act="stuckpick" data-i="${i}"><span>${s[0]}</span>${s[1]}</button>`).join('')}</div>`)},
 stuckpick(t){const s=STUCK[+t.dataset.i];modal(`<small class="cm-k">${s[0]} ${s[1].toUpperCase()}</small><h2 class="cm-h">${s[2]}</h2><div class="cn-b" style="justify-content:center"><button class="btn" data-act="calm2">▶ Just 2 minutes</button><button class="btn ghost" data-act="calmpick">🎲 Something else</button></div>`)},
 calm2(){calmTimer(120)},
 dumpadd(){const q=$('#qin'),m=$('#calmmodal');const i=(q&&m&&m.style.display!=='none')?q:$('#dumpin');const v=i&&i.value.trim();if(!v)return;S.dump.unshift({id:uid(),t:v});save();CORE_ACT.cmclose();rerender();toast('🧠 Out of your head, into the app')},
 dumpnext(t){S.nextId=t.dataset.id;save();rerender();window.scrollTo(0,0)},
 quickadd(){modal(`<small class="cm-k">QUICK ADD</small><h2 class="cm-h">What's on your mind?</h2><div class="addrow"><input class="fi" id="qin" placeholder="Type anything…" data-enter="dumpadd"><button class="btn" data-act="dumpadd">Add</button></div><p class="cn-s">It goes to your brain dump. Sort it later.</p>`);setTimeout(()=>{const q=$('#qin');q&&q.focus()},50)},
 focus(){S.focus=!S.focus;save();if(page!=='dashboard'){page='dashboard';history.replaceState(null,'','#dashboard')}render()},
 onbkeep(){try{localStorage.setItem(CALM_ONB,'1')}catch(e){}rerender()},
 onbfresh(){if(!confirm('Start your own planner? The example will be cleared.'))return;try{localStorage.setItem(CALM_ONB,'1')}catch(e){}const k=S.acc;S=APP.blank();S.acc=k;S.dump=[];S._cs=1;save();render();toast('Fresh start ✨')},
 calmhelp(){const pg=(APP.pages.find(p=>p[0]===page)||[])[1]||'This page';modal(`<small class="cm-k">HOW IT WORKS</small><h2 class="cm-h">Small steps, no overwhelm</h2><ul class="help">
  <li><b>Your next small step</b> shows one thing only. Tap <b>Just 5 minutes</b> to start a gentle timer.</li>
  <li><b>Stuck?</b> tells you why it feels hard and what to do instead.</li><li><b>Pick for me</b> chooses something when you can't decide.</li>
  <li><b>+ button</b> (bottom right) dumps any thought in one tap.</li><li><b>Focus mode</b> hides everything except your next step.</li>
  <li>${esc(pg)}: tap any text to edit it. Everything saves automatically on your device.</li></ul>`)}});
(function(){const f=document.createElement('button');f.className='fab';f.dataset.act='quickadd';f.title='Quick add';f.textContent='+';document.body.appendChild(f);
 const db=$('#demobar');if(db&&window.ETSY_URL){db.innerHTML=`✨ <b>Free demo</b> · try anything, your data never leaves your browser · <a href="${window.ETSY_URL}" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">Get the full app on Etsy →</a>`}})();

// New tabs: extra income log + no-spend days
addTab('payments',['income','Extra income','budget'],'income',()=>[[isoAgo(20),'Sold old bike',120,true],[isoAgo(9),'Overtime',85,true],[isoAgo(2),'Garage sale',60,false]].map(([d,s,a,p])=>({date:d,src:s,amt:a,paid:p})),{date:'',src:'',amt:0,paid:false});
addTab('income',['nospend','No-spend days','flame'],'nsd',()=>[{name:'No-spend day',log:logDemo(31,.45),col:'#3F7D5A'}],{name:'No-spend day',log:{}},true);
APP.P.income=()=>{const t=sum(S.income,x=>+x.amt),p=sum(S.income.filter(x=>x.paid),x=>+x.amt);return tablePage({c:'income',t:'Extra income',s:'Side money that goes straight to your debt.',cols:[['paid','Sent to debt','chk'],['date','Date','date'],['src','Where from'],['amt','Amount','money']],addLabel:'Add income',sort:(a,b)=>(b.date||'').localeCompare(a.date||''),
 side:`<div class="card"><h3>Extra money</h3><div style="font:600 34px var(--serif)">${money(t)}</div><small style="color:var(--mute)">${money(p)} already sent to debt</small><div class="bar"><i style="width:${t?pct(p/t):0}%"></i></div></div>`})};
APP.P.nospend=()=>`${head('No-spend days','Tap a square on every day you spend nothing extra. Watch the streak grow 🔥.')}${gridTracker({c:'nsd',t:'This month',label:'Challenge'})}`;

boot();
</script>
