<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Novel Planner</title>
<meta name="theme-color" content="#F7F3EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F2EA;--card:#FFFDF9;--ink:#2E2A26;--mute:#8C8378;--line:#ECE3D6;--soft:#F2EBE0;
--acc:#7D8F75;--acc-l:#E4EADF;--acc-d:#5E6F57;--blush:#D9A79A;--blush-l:#F6E6E0;--gold:#B89A6A;--red:#C46A5A;
--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,-apple-system,Segoe UI,Roboto,sans-serif;--r:18px}
[data-acc=blush]{--acc:#C98F80;--acc-l:#F6E6E0;--acc-d:#A86D5F}
[data-acc=blue]{--acc:#7E95A8;--acc-l:#E3EAF0;--acc-d:#5C7488}
[data-acc=terra]{--acc:#C07A58;--acc-l:#F5E4DA;--acc-d:#9C5C3E}
[data-acc=champ]{--acc:#B89A6A;--acc-l:#F3EBDD;--acc-d:#94784C}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:26px 18px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.mono{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 15px var(--serif);color:var(--gold);letter-spacing:.5px}
.brand b{font:600 22px/1 var(--serif);display:block}
.brand small{color:var(--mute);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;color:#5b544c;font-weight:500;text-align:left}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--acc-l);color:var(--acc-d);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--soft);border-radius:20px;padding:1px 8px;color:var(--mute)}
.nav button.on .cnt{background:#fff}
.sidecd{margin-top:auto;border-radius:16px;background:linear-gradient(160deg,var(--acc-l),var(--blush-l));padding:16px;position:relative;overflow:hidden}
.sidecd .n{font:600 40px/1 var(--serif);color:var(--acc-d)}
.sidecd small{color:#6f675e;font-size:12px}
.sidecd svg{position:absolute;right:-14px;top:-10px;width:96px;opacity:.55}
/* main */
main{flex:1;min-width:0;padding:30px 38px 60px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.top h1{font:600 40px/1 var(--serif);margin:0}
.top p{margin:6px 0 0;color:var(--mute)}
.top .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:7px 14px;font-size:12.5px;color:#5b544c}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--acc-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font:600 21px var(--serif);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3 .x{margin-left:auto;font:500 12px var(--sans);color:var(--mute)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:14px;background:var(--acc-l);display:grid;place-items:center;color:var(--acc-d);flex:none}
.kpi .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
.kpi .v{font:600 28px/1 var(--serif)}
.kpi small{color:var(--mute);font-size:12px;display:block;margin-top:3px}
.kpi .bar{margin-top:7px}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.bl i{background:var(--blush)}.bar.gd i{background:var(--gold)}.bar.rd i{background:var(--red)}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;min-height:230px;padding:34px 38px;background:radial-gradient(120% 140% at 85% 20%,var(--blush-l) 0,transparent 55%),linear-gradient(120deg,#FBF7F0,var(--acc-l));border:1px solid var(--line);display:flex;align-items:center}
.hero .t small{letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--mute)}
.hero h2{font:600 54px/1 var(--serif);margin:8px 0 6px}
.hero p{margin:0;color:#6f675e}
.hero .cd{display:flex;gap:10px;margin-top:20px}
.hero .cd div{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;min-width:72px}
.hero .cd b{font:600 30px/1 var(--serif);display:block}
.hero .cd span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.hero .art{position:absolute;right:0;top:0;bottom:0;width:48%;pointer-events:none}
/* tables/forms */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl tr:hover td{background:#FCF9F4}
.in{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.tbl select.in,.vcard select.in{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:6px;text-overflow:clip}
.tbl select.pill{text-align:center;padding:4px 10px;width:auto;min-width:92px}
.tbl td:first-child{min-width:150px}
.tbl select.in,.vcard select.in{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:6px;text-overflow:clip}
.tbl select.pill{text-align:center;padding:4px 10px;width:auto;min-width:92px}
.tbl td:first-child{min-width:150px}
.in:hover{border-color:var(--line)}.in:focus{outline:0;border-color:var(--acc);background:#fff}
.fi{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;width:100%}
.fi:focus{outline:0;border-color:var(--acc)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600}
.p-yes{background:var(--acc-l);color:var(--acc-d)}.p-pend{background:#F5EEDD;color:#9A7B3E}.p-no{background:#F6E1DC;color:#A5574A}
.del{border:0;background:none;color:#c9bfb3;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:8px}
.del:hover{color:var(--red);background:#F6E1DC}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.addrow .fi{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:#5b544c}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:30px}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.list .it:last-child{border:0}
.list .it small{color:var(--mute);display:block;font-size:12px}
.list .it .r{margin-left:auto;text-align:right}
.ck{appearance:none;width:20px;height:20px;border-radius:7px;border:1.5px solid #cfc4b6;cursor:pointer;flex:none;display:grid;place-items:center;background:#fff}
.ck:checked{background:var(--acc);border-color:var(--acc)}
.ck:checked:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done{text-decoration:line-through;color:var(--mute)}
.photo{border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--blush-l),var(--acc-l));min-height:150px}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:600}
/* vendors */
.vcard{display:flex;flex-direction:column;gap:10px}
.vcard .h{display:flex;gap:12px;align-items:center}
.vcard .ic{width:42px;height:42px;border-radius:12px;background:var(--blush-l);display:grid;place-items:center;color:#A86D5F;flex:none}
.vcard .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.vcard .row{display:flex;justify-content:space-between;font-size:12.5px;color:#5b544c}
/* seating */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.rt{text-align:center}
.rt .tname{font:600 19px var(--serif)}
.rt ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:#5b544c;min-height:20px}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0 14px;display:flex;gap:14px;align-items:flex-start}
.tl .ev:before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl .tm{font:600 20px/1.2 var(--serif);width:70px;flex:none}
.sw{display:flex;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
label.f{display:block;font-size:12px;color:var(--mute);margin:0 0 5px;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;transition:.25s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
.tabbar{display:none}
[data-theme=dark]{--bg:#1C1A18;--card:#262320;--ink:#F1EBE2;--mute:#A79D90;--line:#3A3530;--soft:#2F2B27;--acc-l:#33402F;--blush-l:#3E2E2A}
[data-theme=dark] .hero{background:radial-gradient(120% 140% at 85% 20%,#3E2E2A 0,transparent 55%),linear-gradient(120deg,#2A2622,#2C3529)}
[data-theme=dark] .hero .art,[data-theme=dark] .photo svg,[data-theme=dark] .sidecd svg{opacity:.55}
[data-theme=dark] .hero .cd div{background:rgba(255,255,255,.06)}
[data-theme=dark] .fi,[data-theme=dark] .in:focus,[data-theme=dark] .ck{background:#1F1D1A}
[data-theme=dark] .tbl tr:hover td{background:#2B2824}
[data-theme=dark] .photo{background:linear-gradient(135deg,#3E2E2A,#2C3529)}
[data-theme=dark] .tabs button.on{background:var(--acc);border-color:var(--acc)}
[data-theme=dark] .pill.p-pend{background:#3B3324;color:#D9B977}[data-theme=dark] .pill.p-no{background:#3E2A26;color:#E09A8C}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{min-height:140px;resize:vertical;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;line-height:1.5}
.note textarea:focus{outline:0;border-color:var(--acc);background:var(--card)}
@media print{.side,.tabbar,.btn,.del,.addrow,.tabs,.toast,.photo,.hero .art{display:none!important}body,main{background:#fff;padding:0}.card{border:0;break-inside:avoid}select,input{border:0!important;appearance:none;-webkit-appearance:none}.app{display:block}}@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
 .side{display:none}
 main{padding:18px 16px 96px}
 .top{flex-wrap:wrap}.top h1{font-size:32px}.top .r{margin-left:0}
 .g2,.g21,.g12,.g3{grid-template-columns:1fr}
 .hero{padding:24px;min-height:200px}.hero h2{font-size:40px}.hero .art{opacity:.45;width:70%}
 .hide-m{display:none}
 .grid>*{min-width:0}
 .kpi{gap:10px}.kpi .ic{width:36px;height:36px;border-radius:11px}.kpi .v{font-size:23px}.card{padding:16px}
 .addrow .fi{min-width:0;flex:1 1 40%}
 .hero .cd div{min-width:60px;padding:8px 10px}
 .tblw{overflow-x:auto}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;overflow-x:auto}
 .tabbar button{flex:1 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 2px}
 .tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
 .tabbar button.on{color:var(--acc-d);font-weight:600}
}
.th{border-radius:12px;object-fit:cover;flex:none;cursor:pointer;display:block}
.th.add{border:1.5px dashed var(--line);background:var(--soft);color:var(--mute);display:grid;place-items:center;padding:0;cursor:pointer}
.th.add svg,.tap svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.heroimg{position:absolute;right:22px;top:50%;transform:translateY(-50%) rotate(3deg);width:38%;max-width:300px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:8px solid #fff;box-shadow:0 18px 40px rgba(40,30,20,.22)}
.cover{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;margin-bottom:10px}
.memc .cover{aspect-ratio:4/3;margin:0}.memc{padding:8px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.88);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap;color:#3a332c}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:860px){.album{grid-template-columns:1fr 1fr;gap:10px}.heroimg{position:relative;right:auto;top:auto;transform:rotate(2deg);width:100%;max-width:none;margin-top:16px}.hero:has(.heroimg){flex-direction:column;align-items:stretch}}
@media (max-width:420px){.album{grid-template-columns:1fr}}
html[data-theme=dark]{--bg:#1C1A18;--card:#262320;--ink:#F1EBE2;--mute:#A79D90;--line:#3A3530;--soft:#2F2B27}html[data-theme=dark] .hero{background:radial-gradient(120% 140% at 85% 20%,#3E2E2A 0,transparent 55%),linear-gradient(120deg,#2A2622,#2C3529)}
/* ===== PREMIUM SKIN v2 (FinnestStudio-level polish) ===== */
:root{--serif:'Fraunces',Georgia,serif;--r:20px}
html body{background:#FBF7F1;color:#2A211B;font-size:14.5px}
html .side{background:#F5EEE4;border-right:0;padding:28px 18px 20px}
html .mono{background:var(--acc);border:0;color:#fff;font:700 16px var(--serif);box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
html .brand b{font:700 21px/1.05 var(--serif);letter-spacing:-.01em}
html .nav button{padding:11px 14px;border-radius:14px;color:#4A3F36;font-weight:600}
html .nav button:hover{background:#EDE3D6}
html .nav button.on{background:var(--acc);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
html .nav button.on .cnt{background:rgba(255,255,255,.25);color:#fff}
html .sidecd{background:linear-gradient(150deg,var(--acc),var(--acc-d));color:#fff}
html .sidecd .n{color:#fff;font-weight:800}html .sidecd small{color:rgba(255,255,255,.85)}
html main{padding:34px 42px 60px}
html .top h1{font:750 44px/1.02 var(--serif);letter-spacing:-.02em}
html .top p{color:#7A6E63;font-size:15px}
html .chip{background:#fff;border:1px solid #EADFD2;font-weight:600;color:#4A3F36}
html .btn{border-radius:999px;padding:10px 18px;box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 28%,transparent)}
html .btn.ghost{box-shadow:none;background:#fff;border:1px solid #E6DACB}
html .card{background:#fff;border:1px solid #EFE6DA;border-radius:22px;padding:22px;box-shadow:0 1px 0 rgba(60,40,20,.03),0 10px 30px rgba(60,40,20,.06)}
html .card h3{font:700 20px var(--serif);letter-spacing:-.01em}
html .kpi .ic{background:var(--acc);color:#fff;border-radius:50%;width:46px;height:46px;box-shadow:0 6px 14px color-mix(in srgb,var(--acc) 30%,transparent)}
html .kpi .v{font:800 30px/1 var(--serif);color:var(--acc-d)}
html .bar{height:8px;background:#F1E8DC}
html .hero{background:linear-gradient(135deg,var(--acc) 0%,var(--acc-d) 100%)!important;border:0;color:#fff;box-shadow:0 18px 40px color-mix(in srgb,var(--acc) 30%,transparent)}
html .hero .t small{color:rgba(255,255,255,.8)}
html .hero h2{font:800 54px/1 var(--serif);letter-spacing:-.02em;color:#fff}
html .hero p{color:rgba(255,255,255,.9)}
html .hero .cd div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(4px)}
html .hero .cd b{color:#fff;font-weight:800}html .hero .cd span{color:rgba(255,255,255,.8)}
html .hero .art{opacity:.25}
html .heroimg{border:6px solid #fff}
html .ck{width:22px;height:22px;border-radius:50%;border:2px solid #D8CBBB}
html .ck:checked{background:var(--acc);border-color:var(--acc);box-shadow:0 4px 10px color-mix(in srgb,var(--acc) 30%,transparent)}
html .tabs button{font-weight:600}
html .tabs button.on{background:var(--acc);border-color:var(--acc)}
html .tbl th{color:#9A8D80}
html .pill{padding:4px 11px}
html .list .it{padding:12px 0}
html .tabbar{background:#fff;box-shadow:0 -8px 24px rgba(60,40,20,.06);border-top:0}
html .tabbar button.on{color:var(--acc)}
html .tabbar button.on svg{background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:10px;padding:3px;width:27px;height:27px}
html[data-theme=dark] body{background:#1C1A18;color:#F1EBE2}
html[data-theme=dark] .side{background:#211E1B}
html[data-theme=dark] .card{background:#262320;border-color:#3A3530;box-shadow:none}
html[data-theme=dark] .nav button{color:#D8CFC4}
html[data-theme=dark] .btn.ghost,html[data-theme=dark] .chip{background:#262320;border-color:#3A3530;color:#F1EBE2}

/* ===== CALM LAYER ===== */
.calmtools{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 12px}.calmtools .chip{cursor:pointer}
.calmnext{background:linear-gradient(135deg,#2A211B,#3A2C22)!important;color:#fff;border:0!important;padding:26px 28px!important}
.calmnext .cn-top{display:flex;align-items:center;gap:10px}.cn-pill{white-space:nowrap;background:var(--acc);color:#fff;border-radius:999px;padding:5px 12px;font:700 12px var(--sans);letter-spacing:.04em}
.cn-src{font-size:12.5px;color:rgba(255,255,255,.6)}.cn-help{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;font-weight:700}

/* BestInCell Sync: phone <-> computer, no account.
   Usage: BICSync.init({keys:['family-v1'], name:'Family Planner'})  then BICSync.open() from a button.
   Data is encrypted on the device (AES-GCM 256) before it leaves; the server only stores ciphertext.
   Pairing: device A shows a 6-digit code (10 min). Device B types it and receives the sync id + key,
   wrapped with a key derived from the code (PBKDF2).
   v2 (2026-11-02): no reliance on device clocks, 3-way merge when two devices edited (nothing is lost),
   automatic retries, background check every 45 s, gzip for big data (photos), clear error messages.
   v3 (2026-11-02): one link for every app on the site. The first link stores a group id + key ("bic-sync:*");
   every other app derives its own sync id from it (sha256(group:appKey)) and turns sync on by itself. */
(function () {
  const API = 'https://bic-sync.bestincell.workers.dev';
  const LS = 'bic-sync';
  const MAXLEN = 1900000, ZIP_OVER = 200000, POLL = 45000;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
  const ub64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const hex = (u8) => [...u8].map((b) => b.toString(16).padStart(2, '0')).join('');
  let CFG = { keys: [], name: 'this app' }, ST = null, applying = false, timer = null, retry = null, busy = false, again = false, edits = 0, fails = 0, lastMsg = '';
  const set0 = Storage.prototype.setItem;

  const stKey = () => LS + ':' + CFG.keys[0];
  let OFF = false; // sync turned off for this app on this device: never auto-join it
  const loadSt = () => { try { ST = JSON.parse(localStorage.getItem(stKey())) } catch (e) { ST = null } OFF = !!(ST && ST.off); if (OFF || (ST && !ST.sid)) ST = null };
  const saveSt = () => { try { set0.call(localStorage, stKey(), JSON.stringify(ST)) } catch (e) {} };

  // ---------- one link for all apps ----------
  const GK = LS + ':*';
  const loadG = () => { try { const g = JSON.parse(localStorage.getItem(GK)); return g && g.g && g.k ? g : null } catch (e) { return null } };
  const saveG = (g) => { try { set0.call(localStorage, GK, JSON.stringify(g)) } catch (e) {} };
  const derive = async (g) => hex(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(g + ':' + CFG.keys[0])))).slice(0, 32);
  function promote() { // device linked before v3: its oldest per-app link becomes the group (same choice on every linked device)
    if (loadG()) return;

    if (c.length) { c.sort((a, b) => (a.sid < b.sid ? -1 : 1)); saveG({ g: c[0].sid, k: c[0].k }) }
  }

function donut(parts,size=170,center='',lab='SPENT'){const tot=parts.reduce((a,b)=>a+b.v,0)||1;let a0=-90,s='';const r=size/2-14,c=size/2;
 parts.forEach(p=>{if(!p.v)return;const a1=a0+p.v/tot*360,la=a1-a0>180?1:0,R=Math.PI/180;

 return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" style="stroke:var(--soft)" stroke-width="22" fill="none"/>${s}<text x="${c}" y="${c+2}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="26" font-weight="600" style="fill:var(--ink)">${center}</text><text x="${c}" y="${c+20}" text-anchor="middle" font-size="10" fill="#8C8378" letter-spacing="1">${lab}</text></svg>`}

const nvClone=c=>JSON.parse(JSON.stringify((APP.defaults||{})[c]||{}));
Object.assign(APP.act,{
 nvlog:()=>{const p=nvCur(),v=xNum(($('#nvw')||{}).value),md=($('#nvmode')||{}).value;if(!v){toast('Type your word count first');return}let w=v;if(md==='tot'){w=v-nvWords(p);if(w<0&&!confirm(`That’s ${nvN(-w)} fewer than your current total. Log it as cut words?`))return}if(!w){toast('No change from your current total');return}nvLogW(p,w,xNum(($('#nvm')||{}).value))},
 nvquick:t=>nvLogW(nvCur(),+t.dataset.w),
 nvslog:()=>{const w=xNum(($('#nvsw')||{}).value);if(!w){toast('Type the words from your sprint');return}nvLogW(nvCur(),w,xNum(($('#nvsm')||{}).value)||25,true)},
 nvsprint:t=>{const m=+t.dataset.m||25,l=t.dataset.l||'Sprint';XT.list.unshift({id:uid(),label:l,total:m*60,left:m*60,end:Date.now()+m*6e4,run:true});xTStart();toast('⏱ '+m+'-minute sprint started. Go!');X.go('write','sprint')},
 nvnewp:()=>{const p=Object.assign(nvClone('projects'),{id:uid(),name:'New novel',start:xToday(),off:[]});S.projects.push(p);S.nvCur=p.id;save();toast('New project. Name it and set your goal.');X.go('projects','list')},
 nvcur:t=>{if(!nvP(t.dataset.id))return;S.nvCur=t.dataset.id;save();if(t.dataset.k)X.go(t.dataset.k,t.dataset.s);else{toast('Now working on '+nvP(t.dataset.id).name);rerender()}},
 nvdelp:t=>{const p=nvP(t.dataset.id);if(!p||!confirm(`Delete “${p.name}” and everything in it (sessions, outline, characters, notes)? This can’t be undone.`))return;S.projects=S.projects.filter(x=>x.id!==p.id);['sessions','beats','scenes','chars','rels','places','events','research','revs','betas','feedback','agents','qkit','pubs'].forEach(k=>S[k]=S[k].filter(x=>x.pid!==p.id));if(S.nvCur===p.id)S.nvCur=(S.projects[0]||{}).id||'';if(S.nvPub===p.id)S.nvPub='';save();rerender()},
 nvday:t=>{const p=nvCur();if(!p)return;const a=String(p.days||'1111111').split(''),i=+t.dataset.d;a[i]=a[i]==='0'?'1':'0';if(!a.includes('1')){toast('Keep at least one writing day');return}p.days=a.join('');save();rerender()},
 nvstrat:t=>{const p=nvCur();if(!p)return;p.strat=t.dataset.k;save();rerender()},
 nvoff:t=>{const p=nvCur();if(!p)return;const d=t.dataset.d;p.off=Array.isArray(p.off)?p.off:[];if(p.off.includes(d))p.off=p.off.filter(x=>x!==d);else p.off.push(d);save();toast(p.off.includes(d)?nvFmt(d)+' is a day off. Its words moved to other days.':nvFmt(d)+' is a writing day again.');rerender()},
 nvmo:t=>{const d=+t.dataset.d;F.nvmo=d?(+F.nvmo||0)+d:0;rerender()},
 nvchal:()=>{const p=nvCur();if(!p)return;p.cS=($('#nvcs')||{}).value||xToday();p.cG=xNum(($('#nvcg')||{}).value)||50000;p.cL=xNum(($('#nvcl')||{}).value)||30;if(['Idea','Planning'].includes(p.stage))p.stage='Drafting';save();toast(`Challenge on: ${nvN(p.cG)} words by ${nvFmt(nvAdd(p.cS,p.cL-1))}`);rerender()},
 nvchalend:()=>{const p=nvCur();if(!p||!confirm('End this challenge? Your sessions stay in your log.'))return;p.cS='';save();rerender()},
 nvstruct:t=>{const p=nvCur();if(!p)return;p.struct=t.dataset.k;save();rerender()},
 nvaddsc:()=>{const p=nvCur();if(!p)return;const sc=nvScenes(p.id),l=sc[sc.length-1],ch=l?xNum(l.ch)||1:1;S.scenes.push(Object.assign(nvClone('scenes'),{id:uid(),pid:p.id,ch,n:sc.filter(s=>xNum(s.ch)===ch).length+1}));save();toast('Scene added to chapter '+ch);rerender()},
 nvaddch:()=>{const p=nvCur();if(!p)return;const ch=Math.max(0,...nvScenes(p.id).map(s=>xNum(s.ch)))+1;S.scenes.push(Object.assign(nvClone('scenes'),{id:uid(),pid:p.id,ch,n:1}));save();toast('Chapter '+ch+' started');rerender()},
 nvmove:t=>{const s=S.scenes.find(x=>x.id===t.dataset.id);if(!s)return;const i=Math.max(0,Math.min(NV_SST.length-1,NV_SST.indexOf(s.status)+(+t.dataset.d)));s.status=NV_SST[i];save();rerender()},
 nvsdone:t=>{const s=S.scenes.find(x=>x.id===t.dataset.id);if(!s)return;s.status='Drafted';save();const n=nvScenes(s.pid).find(x=>NV_SST.indexOf(x.status)<2);toast('✓ Drafted'+(xNum(s.words)?'':'. Add its word count in the outline')+(n?' · Next: '+n.title:''));rerender()},
 nvadd:t=>{const c=t.dataset.c,p=t.dataset.p==='pub'?nvPubP():nvCur();if(!p){toast('Start a project first');return}const it=Object.assign(nvClone(c),{id:uid(),pid:p.id});if(c==='qkit'||c==='pubs'){if(c==='pubs')it.ph='Launch';S[c].push(it)}else S[c].unshift(it);save();rerender()},
 nvaddses:()=>{const p=nvCur();if(!p)return;S.sessions.unshift(Object.assign(nvClone('sessions'),{id:uid(),pid:p.id,date:xToday(),time:nvNowT()}));save();rerender()},
 nvaddev:()=>{const p=nvCur();if(!p)return;S.events.push(Object.assign(nvClone('events'),{id:uid(),pid:p.id,n:Math.max(0,...nvOf('events',p.id).map(e=>xNum(e.n)))+1}));save();rerender()},
 nvaddrev:t=>{const p=nvCur();if(!p)return;S.revs.push({id:uid(),pid:p.id,pass:t.dataset.ps,t:'',done:false});save();rerender()},
 nvrevreset:()=>{const p=nvCur();if(!p)return;const n=(xNum(p.draft)||1)+1;if(!confirm(`Start draft ${n}? Every checklist item will be unchecked.`))return;p.draft=n;S.revs.forEach(x=>{if(x.pid===p.id)x.done=false});if(['Drafting','Planning'].includes(p.stage))p.stage='Revising';save();toast('Draft '+n+'. Fresh checklist, same story.');rerender()},
 nvthank:t=>{const b=S.betas.find(x=>x.id===t.dataset.id);if(!b)return;b.status='Thanked';save();rerender()},
 nvcnr:t=>{const pid=t.dataset.p||(nvPubP()||{}).id,L=nvExpired(pid);L.forEach(a=>{a.status='No response';a.reply=nvClose(a)});save();toast(L.length+' marked as no response. Onward.');rerender()},
 nvsent:t=>{const a=S.agents.find(x=>x.id===t.dataset.id);if(!a)return;a.sent=xToday();a.status='Queried';if(!xNum(a.weeks))a.weeks=8;save();toast('Queried ✓ Closes '+nvFmt(nvClose(a)));rerender()},
 nvpubdates:()=>{const p=nvPubP();if(!p)return;if(!p.launch){toast('Set a launch date first');return}const c={};S.pubs.filter(x=>x.pid===p.id).forEach(x=>{const o=NV_PUBOFF[x.ph]!=null?NV_PUBOFF[x.ph]:-14;c[x.ph]=(c[x.ph]||0);x.due=nvAdd(p.launch,o+7*c[x.ph]++)});save();toast('Due dates filled from your launch date');rerender()}});
if(!S.nvCur&&S.projects[0])S.nvCur=S.projects[0].id;
S.projects.forEach(p=>{if(!Array.isArray(p.off))p.off=[]});

boot();
</script>
</body>
